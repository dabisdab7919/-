<script>
/* 이미지를 클릭하면 크게 열리고, 화살표 버튼 / 키보드 ← → 로 넘기고, Esc 로 닫음 */
(function(){
  if(window.__nytLB) return; window.__nytLB = 1;
  var lb, stage, count, cap, list = [], idx = 0;

  function build(){
    if(lb) return;
    lb = document.createElement('div'); lb.className = 'nyt-lb';
    lb.innerHTML = '<span class="lb-count"></span><button class="lb-close" aria-label="닫기">&times;</button>' +
      '<button class="lb-nav lb-prev" aria-label="이전"><svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg></button>' +
      '<div class="lb-stage"></div>' +
      '<button class="lb-nav lb-next" aria-label="다음"><svg viewBox="0 0 24 24"><path d="M9 4l8 8-8 8"/></svg></button>' +
      '<div class="lb-cap"></div>';
    document.body.appendChild(lb);
    stage = lb.querySelector('.lb-stage'); count = lb.querySelector('.lb-count'); cap = lb.querySelector('.lb-cap');
  }
  function srcOf(mi){                             /* 이미지 주소 읽기: srcset에 있는 가장 큰 크기를 우선 사용 */
    var r = mi.shadowRoot, el = (r && r.querySelector('img')) || mi.querySelector('img');
    if(!el) return {best:'', cur:''};
    var ss = el.getAttribute('srcset') || '';
    if(!ss && el.parentNode && el.parentNode.querySelector){ var so = el.parentNode.querySelector('source'); ss = so ? (so.getAttribute('srcset') || '') : ''; }
    var best = '', bw = 0;
    ss.split(',').forEach(function(p){
      p = p.trim().split(/\s+/); var w = parseFloat(p[1]) || 0;
      if(p[0] && w >= bw){ bw = w; best = p[0]; }
    });
    var cur = el.currentSrc || el.src || '';
    return {best: best || cur, cur: cur};
  }
  function show(){
    var mi = list[idx], src = srcOf(mi), node;
    stage.innerHTML = '';
    if(src.best){                                  /* 큰 해상도를 차례로 시도하고, 모두 실패하면 원래 주소 */
      var base = src.best;
      var cands = [2400, base, 1600].map(function(w){ return typeof w === 'number' ? base.replace(/\/w\/\d+\//, '/w/' + w + '/') : w; })
        .filter(function(u, i, a){ return a.indexOf(u) === i; });
      if(cands.indexOf(src.cur) < 0) cands.push(src.cur);
      var k = 0;
      node = document.createElement('img'); node.alt = '';
      node.onerror = function(){ k++; if(k < cands.length) node.src = cands[k]; };
      node.src = cands[0];
    }
    else { node = mi.cloneNode(true); node.removeAttribute('slot'); node.classList.remove('zoomable'); }   /* 주소를 못 읽으면 Cargo 이미지 요소를 그대로 복제 */
    stage.appendChild(node);
    count.textContent = (idx + 1) + ' / ' + list.length;
    var story = mi.closest('.nyt-story, .nyt-lead'), c = story && story.querySelector('.nyt-cap');
    cap.textContent = c ? c.textContent : '';
  }
  function go(n){ idx = (n + list.length) % list.length; show(); }
  function open(mi){
    var ss = mi.closest('gallery-slideshow');
    list = [].slice.call(ss.querySelectorAll('media-item')); idx = list.indexOf(mi);
    build(); show(); lb.classList.add('open');
  }
  function close(){ if(lb) lb.classList.remove('open'); }

  document.addEventListener('click', function(e){
    var t = e.target, path = e.composedPath ? e.composedPath() : [];
    if(lb && lb.classList.contains('open')){
      if(t.closest('.lb-prev')) return go(idx - 1);
      if(t.closest('.lb-next')) return go(idx + 1);
      if(t.closest('.lb-close') || t === lb || t === stage) close();
      return;
    }
    for(var i = 0; i < path.length; i++){
      var n = path[i];
      if(n.tagName === 'MEDIA-ITEM' && n.closest && n.closest('.nyt-ss')){
        if(n.getAttribute('disable-zoom') === 'true') return;   /* 확대 끄기로 지정된 이미지는 열지 않음 */
        open(n); return;
      }
    }
  });
  document.addEventListener('keydown', function(e){
    if(!lb || !lb.classList.contains('open')) return;
    if(e.key === 'Escape') close();
    else if(e.key === 'ArrowLeft') go(idx - 1);
    else if(e.key === 'ArrowRight') go(idx + 1);
  });
})();
</script>
